[project]
name = "edgecase-equalizer"
version = "1.0.0"
description = "Practice management system for independent therapists"
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.11"
authors = [
    {name = "Richard Sembera"}
]
keywords = ["therapy", "practice-management", "healthcare", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]

dependencies = [
    "Flask>=3.1.0",
    "Werkzeug>=3.1.0",
    "waitress>=3.0.0",
    "sqlcipher3-wheels>=0.5.0",
    "cryptography>=46.0.0",
    "argon2-cffi>=25.0.0",
    "reportlab>=4.4.0",
    "pypdf>=5.0.0",
    "Markdown>=3.10",
    "psutil>=7.0.0",
]

[project.optional-dependencies]
ai = [
    "llama_cpp_python>=0.3.34",
    "huggingface_hub>=1.0.0",
]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[project.scripts]
edgecase = "web.cli:run"

[project.urls]
Homepage = "https://edgecaseequalizer.ca"
Repository = "https://github.com/rsembera/edgecase"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "web*", "utils*", "pdf*", "ai*"]

[tool.setuptools.package-data]
"web" = ["templates/**/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Pyflakes (the "F" rules) is the bug-relevant set: undefined names (F821),
# broken/duplicate imports (F811), f-string mistakes, etc. — the class of defect
# a structural refactor can introduce and that tests miss on unexercised paths
# (this is exactly how the EntryLockedError NameError was caught). Run
# `venv/bin/ruff check` as a quick "did I break a reference?" gate; a clean run
# is the green baseline.
#
# F401 (unused import) and F841 (unused local) are intentionally not enforced:
# the existing code carries some, none are bugs, and flagging them would bury the
# high-signal checks in cosmetic noise. Remove them from `ignore` for a full
# tidy-up pass.
select = ["F"]
ignore = ["F401", "F841"]
